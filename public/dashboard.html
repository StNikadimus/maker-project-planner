<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard &ndash; Maker Project Planner</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="page">
    <div id="loading" class="loading-state">
      <span class="spinner" role="status" aria-label="Loading"></span>
    </div>
    <div id="dashboard" class="container container--with-tabs" hidden>
      <header class="dashboard-header">
        <div>
          <select id="workspace-select" class="workspace-select"></select>
          <h1>Welcome, <span id="name"></span></h1>
        </div>
        <button id="signout" class="btn btn--secondary">Sign out</button>
      </header>

      <section class="card card--wide">
        <h2>New project</h2>
        <form id="project-form" class="form--inline">
          <input id="project-name" name="projectName" type="text" placeholder="Project name" required />
          <button type="submit" class="btn">Add</button>
        </form>
        <p id="projects-error" class="error-text" role="alert"></p>
      </section>

      <section class="card card--wide">
        <h2>Your projects</h2>
        <ul id="projects-list" class="projects-list"></ul>
      </section>

      <section class="card card--wide">
        <h2>Shared with you</h2>
        <ul id="shared-projects-list" class="projects-list"></ul>
      </section>

      <section class="card card--wide" id="students-section" hidden>
        <h2>My Students</h2>
        <ul id="students-list" class="projects-list"></ul>
        <p id="students-error" class="error-text" role="alert"></p>
      </section>
    </div>
  </main>
  <nav class="tab-bar">
    <a href="dashboard.html" class="tab--active">Home</a>
    <a href="friends.html">Friends</a>
    <a href="team.html" id="team-tab" hidden>Team</a>
    <a href="profile.html">Profile</a>
  </nav>
  <script type="module" src="js/dashboard.js"></script>
</body>
</html>
