<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Project &ndash; Maker Project Planner</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="page">
    <p id="loading">Loading&hellip;</p>
    <div id="project" class="container" hidden>
      <a href="dashboard.html" class="back-link">&larr; Back to dashboard</a>
      <div class="card card--wide">
        <h1 id="project-name"></h1>
        <p id="project-meta" class="muted"></p>
        <button id="delete-project" class="btn btn--danger" hidden>Delete project</button>
      </div>

      <section class="card card--wide" id="share-section" hidden>
        <h2>Share this project</h2>
        <button id="create-invite" class="btn">Create invite link</button>
        <div id="invite-result" hidden>
          <input id="invite-link" type="text" readonly />
          <button id="copy-invite" type="button" class="btn btn--secondary btn--small">Copy</button>
          <p class="muted">Expires in 7 days.</p>
        </div>
        <p id="invite-error" class="error-text" role="alert"></p>
      </section>

      <section class="card card--wide">
        <h2>Steps</h2>
        <form id="step-form" class="step-form">
          <input id="step-title" type="text" placeholder="Step title" required />
          <textarea id="step-notes" placeholder="Notes (optional)" rows="2"></textarea>
          <input id="step-materials" type="text" placeholder="Materials, comma separated (optional)" />
          <input id="step-tools" type="text" placeholder="Tools, comma separated (optional)" />
          <button type="submit" class="btn">Add step</button>
        </form>
        <p id="steps-error" class="error-text" role="alert"></p>
        <ul id="steps-list" class="steps-list"></ul>
      </section>
    </div>
    <p id="error" class="error-text" role="alert"></p>
  </main>
  <script type="module" src="js/project.js"></script>
</body>
</html>
